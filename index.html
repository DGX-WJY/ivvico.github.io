<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneFile Site</title>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 主渐变：黄到橙 -->
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFC048" />
      <stop offset="100%" stop-color="#FF9F43" />
    </linearGradient>
    <!-- 暗部渐变：偏橙红 -->
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB142" />
      <stop offset="100%" stop-color="#FF7F00" />
    </linearGradient>
  </defs>

  <!-- 黑色背景 -->
  <rect width="500" height="500" fill="#000000" />

  <!-- 左侧圆点 -->
  <circle cx="60" cy="110" r="30" fill="url(#gradMain)" />
  <!-- 右侧圆点 -->
  <circle cx="440" cy="110" r="30" fill="url(#gradMain)" />

  <!-- 左侧圆角矩形 -->
  <rect x="30" y="170" width="60" height="150" rx="15" ry="15" fill="url(#gradMain)" />
  <!-- 右侧圆角矩形 -->
  <rect x="410" y="170" width="60" height="150" rx="15" ry="15" fill="url(#gradMain)" />

  <!-- 中间复杂几何组 (W形穿插) -->
  <g>
    <!-- 左外斜条 -->
    <path d="M85,20 L165,25 L245,280 L195,310 Z" fill="url(#gradMain)" />
    <!-- 左内暗条 -->
    <path d="M185,35 L225,120 L265,230 L205,300 Z" fill="url(#gradDark)" />
    
    <!-- 中左斜条 -->
    <path d="M180,20 L260,20 L300,180 L250,320 L200,310 Z" fill="url(#gradMain)" />
    <!-- 中右斜条 -->
    <path d="M240,20 L320,20 L340,180 L300,320 L250,310 Z" fill="url(#gradMain)" />
    
    <!-- 右外斜条 -->
    <path d="M335,20 L415,40 L365,300 L300,320 Z" fill="url(#gradMain)" />
    <!-- 右内暗条 -->
    <path d="M295,120 L335,25 L395,120 L315,300 Z" fill="url(#gradDark)" />
    
    <!-- 中心菱形暗部 -->
    <path d="M250,210 L285,280 L250,310 L215,280 Z" fill="url(#gradDark)" />
  </g>

  <!-- 底部左侧折线 -->
  <path d="M135,350 L165,345 L200,345 L200,385 L115,435 L135,390 Z" fill="url(#gradDark)" />
  <path d="M155,355 L185,352 L200,352 L200,375 L125,420 L145,385 Z" fill="url(#gradMain)" />

  <!-- 底部右侧折线 -->
  <path d="M365,350 L335,345 L300,345 L300,385 L385,435 L365,390 Z" fill="url(#gradDark)" />
  <path d="M345,355 L315,352 L300,352 L300,375 L375,420 L355,385 Z" fill="url(#gradMain)" />

  <!-- 底部横线1 -->
  <rect x="0" y="435" width="500" height="20" fill="url(#gradMain)" />
  <!-- 底部横线2 -->
  <rect x="0" y="465" width="500" height="15" fill="#FFE066" />
</svg>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 500 500%22><circle cx=%22250%22 cy=%22250%22 r=%22250%22 fill=%22url(%23gradMain)%22/><defs><linearGradient id=%22gradMain%22 x1=%220%25%22 y1=%220%25%22 x2=%22100%25%22 y2=%22100%25%22><stop offset=%220%25%22 stop-color=%22%23FFE066%22/><stop offset=%2250%25%22 stop-color=%22%23FFC048%22/><stop offset=%22100%25%22 stop-color=%22%23FF9F43%22/></linearGradient></defs></svg>">

<style>
/* ========== 基础变量 ========== */
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #222;
  --primary: #4f46e5;
  --shadow: rgba(0,0,0,.08);
}

[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e5e7eb;
  --primary: #818cf8;
  --shadow: rgba(0,0,0,.4);
}

/* ========== 全局 ========== */
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  transition: .3s;
}

/* ========== 导航 ========== */
nav {
  display: flex;
  justify-content: space-between;
  padding: 1rem 2rem;
  background: var(--card);
  box-shadow: 0 2px 10px var(--shadow);
}

nav h1 {
  margin: 0;
  font-size: 1.2rem;
}

nav button {
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
}

/* ========== Hero ========== */
.hero {
  text-align: center;
  padding: 4rem 1rem;
}

.hero h2 {
  font-size: 2.5rem;
  margin-bottom: .5rem;
}

.hero p {
  opacity: .8;
}

/* ========== 特性卡片 ========== */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  padding: 2rem;
}

.card {
  background: var(--card);
  padding: 1.5rem;
  border-radius: 12px;
  box-shadow: 0 4px 15px var(--shadow);
  transition: transform .2s;
}

.card:hover {
  transform: translateY(-5px);
}

/* ========== 留言板 ========== */
.board {
  max-width: 600px;
  margin: 2rem auto;
  padding: 1rem;
}

.board textarea {
  width: 100%;
  height: 100px;
  padding: .8rem;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.board button {
  margin-top: .5rem;
  padding: .6rem 1.2rem;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.messages div {
  background: var(--card);
  margin-top: .5rem;
  padding: .8rem;
  border-radius: 8px;
}

/* ========== 动画 ========== */
.fade {
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
</style>
</head>

<body>

<!-- 导航 -->
<nav>
  <h1>🌐 OneFile Site</h1>
  <button onclick="toggleTheme()">🌓</button>
</nav>

<!-- Hero -->
<section class="hero fade">
  <h2>一个 HTML，搞定一切</h2>
  <p>无需服务器 · 无需框架 · 纯前端</p>
</section>

<!-- 特性 -->
<section class="features">
  <div class="card">
    <h3>⚡ 极速</h3>
    <p>单文件加载，毫秒级渲染</p>
  </div>
  <div class="card">
    <h3>📱 响应式</h3>
    <p>手机 / 平板 / 桌面自适应</p>
  </div>
  <div class="card">
    <h3>🧠 智能</h3>
    <p>本地存储，无需数据库</p>
  </div>
</section>

<!-- 留言板 -->
<section class="board fade">
  <h3>📝 留言板</h3>
  <textarea id="msg" placeholder="说点什么..."></textarea>
  <button onclick="addMsg()">发布</button>

  <div class="messages" id="messages"></div>
</section>

<script>
/* ========== 主题切换 ========== */
function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", t === "dark" ? "light" : "dark");
  localStorage.setItem("theme", t === "dark" ? "light" : "dark");
}

/* 初始化主题 */
const saved = localStorage.getItem("theme");
if (saved) document.documentElement.setAttribute("data-theme", saved);

/* ========== 留言功能 ========== */
function addMsg() {
  const text = document.getElementById("msg").value.trim();
  if (!text) return;

  const list = JSON.parse(localStorage.getItem("msgs") || "[]");
  list.push(text);
  localStorage.setItem("msgs", JSON.stringify(list));

  document.getElementById("msg").value = "";
  renderMsg();
}

function renderMsg() {
  const list = JSON.parse(localStorage.getItem("msgs") || "[]");
  document.getElementById("messages").innerHTML = list
    .map(m => `<div>${m}</div>`)
    .join("");
}

renderMsg();
</script>

</body>
</html>
